services:
  web:
    build: ./web
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  redis:
    build: ./redis
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HOST_PORT:-5000}:80"
    depends_on:
      - web

volumes:
  redis-data:
